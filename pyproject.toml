[project]
name = "pear_ebi"
version = "1.1.1"
description = "Embeds phylogenetic tree distances and produce representations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Rubbi", email = "andrea.rubbi.98@gmail.com" }]
maintainers = [{ name = "Andrea Rubbi", email = "andrear@ebi.ac.uk" }]
keywords = ["phylogenetics", "phylogenetic-trees", "embedding", "robinson-foulds", "newick"]

# Was absent entirely, so pip would install on any interpreter and fail at runtime.
#
# Floor: 3.10. It was 3.9 until Python 3.9 went end-of-life in October 2025 and the
# security fixes for the dependency tree stopped being available for it -- pillow,
# urllib3, requests, jupyter-server, click, filelock, setuptools, bleach, black and
# pytest all publish their patched releases as requires-python >= 3.10, so staying on
# 3.9 meant staying on versions with known advisories. Raising the floor is what
# makes a vulnerability-free lockfile possible at all.
#
# Ceiling: 3.14, i.e. 3.13 is supported. It was excluded while NumPy < 2 held --
# NumPy 1.26.4 is the last 1.x release and ships no cp313 wheels -- and that pin
# turned out to rest on a false premise (see the numpy entry below), so both went
# together. 3.13 is exercised in CI and the whole suite plus all three notebooks
# were run on it. 3.14 is left out only because it has not been tried.
requires-python = ">=3.10,<3.14"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Runtime dependencies: only packages actually imported by pear_ebi/.
# Every entry has a floor; the previous "<=X" style pins left the lower bound wide
# open (e.g. "pandas<=2.3.3" permitted pandas 0.1).
#
# The scientific stack no longer carries ceilings. They were all downstream of
# "numpy<2.0", which was justified on the grounds that pyDRMetrics 0.0.7 had not
# been ported. That was checked rather than assumed: pyDRMetrics contains no
# NumPy-2-removed alias, and DRMetrics computes the same Qlocal/Qglobal under NumPy
# 2.5.2 as under 1.26.4. With the pin gone, scipy, scikit-learn and pandas -- whose
# ceilings existed only to stay numpy-1-compatible -- can float as well. Verified on
# Python 3.13 with numpy 2.5.2, pandas 3.0.5, scipy 1.18.1 and scikit-learn 1.9.0:
# the full suite passes and all three notebooks execute without error.
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "matplotlib>=3.4",
  "scikit-learn>=1.0",
  "scipy>=1.7",
  "rich>=12,<15",
  "toml>=0.10,<0.11",
  # plotly >= 6.1 with kaleido >= 1. The old pairing was plotly 5 with kaleido
  # pinned to exactly 0.2.1, because kaleido 1.x dropped kaleido.scopes.plotly,
  # which plotly 5's write_image imports -- so the PDF export at
  # embeddings/graph/graph.py raised on a fresh install with any newer kaleido.
  # Moving both forward together fixes it properly: png, pdf and svg export were
  # all confirmed working on plotly 7.0.0 with kaleido 1.3.0.
  "plotly>=6.1",
  "kaleido>=1.0",
  "ipywidgets>=7.7,<9",
  # plotly >= 6 renders FigureWidget through anywidget rather than ipywidgets, and
  # raises ImportError("Please install anywidget to use the FigureWidget class")
  # without it. Every interactive plot PEAR produces is a FigureWidget, so this is
  # a hard requirement, not an extra. With it, the widget still registers as an
  # ipywidgets Widget and still emits application/vnd.jupyter.widget-view+json.
  "anywidget>=0.9",
  "pyDRMetrics==0.0.7",
  # Required transitively, NOT by pear_ebi itself: pyDRMetrics 0.0.7 declares no
  # dependencies at all (its Requires-Dist is empty) while importing numpy, pandas,
  # matplotlib, scipy, sklearn and tqdm. Everything but tqdm is already listed
  # above, so tqdm has to stay here even though nothing in pear_ebi imports it --
  # dropping it makes `import pear_ebi.tree_set` fail with ModuleNotFoundError.
  "tqdm>=4.60",
]

[project.optional-dependencies]
# The Jupyter stack was previously declared as hard runtime dependencies with
# exact pins, although none of it is imported anywhere in pear_ebi/. It is only
# needed to *run* the notebooks, so it is optional now. This also drops the
# unpinned-below, EOL notebook 6.5.6 / jupyterlab 3.5.0 pair, whose pyzmq 24
# dependency is the usual fresh-install failure on modern interpreters.
notebook = [
  "jupyter>=1.0",
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "ipykernel>=6.17",
  "ipython>=8.6",
]

[project.urls]
# setup.py pointed at the old repo name (AndreaRubbi/TreeEmbedding), which is
# the URL PyPI showed as "Homepage".
Homepage = "https://github.com/AndreaRubbi/Pear-EBI"
Repository = "https://github.com/AndreaRubbi/Pear-EBI"
Documentation = "https://andrearubbi.github.io/Pear-EBI/index.html"

[project.scripts]
pear_ebi = "pear_ebi.__main__:main"

# ─── Poetry-specific packaging ────────────────────────────────────────────────
[tool.poetry]
# Naming pear_ebi explicitly stops the root test/ directory being picked up.
# setup.py used a bare find_packages(), which installed a top-level "test"
# package into site-packages, shadowing the CPython stdlib "test" module.
packages = [{ include = "pear_ebi" }]

# Vendored native tools: the executables, their licences, and their C/C++ sources.
# The upstream build byproducts (CMake trees, .o files, autotools logs, 37 MB of
# sample datasets, macOS ._* forks) were removed, taking the wheel from 118.8 MB to
# 9.1 MB uncompressed.
#
# The sources are kept deliberately, for two reasons. HashRF is GPL-2 and tqDist is
# GPL-3/LGPL-3, so distributing the binaries carries a source-provision obligation.
# And _install_helpers.build_tqdist() needs CMakeLists.txt plus the sources to
# rebuild locally, which is the documented escape hatch when the bundled binary does
# not match the host architecture (the macOS binaries are arm64-only).
include = [
  { path = "pear_ebi/calculate_distances/linux_bin/**/*", format = ["sdist", "wheel"] },
  { path = "pear_ebi/calculate_distances/mac_bin/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
# Previously undeclared: pytest appeared only in versions.txt.
pytest = ">=7.0"
pytest-timeout = ">=2.0"
black = ">=23.1"
isort = ">=5.10"
pre-commit = ">=3.5"
pytest-cov = ">=4.0"
# The tests read pyproject.toml. tomllib is stdlib from 3.11; on 3.10 it is not,
# and a bare `import tomllib` there is what failed CI on 3.9 and 3.10.
tomli = { version = ">=2.0", python = "<3.11" }

[tool.poetry.group.docs.dependencies]
# Every plugin mkdocs.yml requires. None of these were declared anywhere before,
# so `mkdocs build` was not reproducible.
mkdocs = ">=1.4"
mkdocs-material = ">=9.0"
mkdocstrings = ">=0.20"
mkdocs-minify-plugin = ">=0.6"
mkdocs-git-revision-date-localized-plugin = ">=1.2"
mkdocs-git-authors-plugin = ">=0.7"
mkdocs-table-reader-plugin = ">=2.0"
mkdocs-img2fig-plugin = ">=0.9"
mknotebooks = ">=0.8"
mkdocs-awesome-pages-plugin = ">=2.9"
mkdocs-print-site-plugin = ">=2.3"
mkgendocs = ">=0.9"
nbconvert = ">=7.0"
PyYAML = ">=6.0"        # imported by gendoc.py, declared nowhere before

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# ─── Tooling ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# The suite lives in test/test.py, which matches neither of pytest's default
# python_files patterns (test_*.py, *_test.py), so `pytest` collected 0 items.
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.isort]
profile = "black"
line_length = 90
# Consolidated from .isort.cfg, whose known_third_party list omitted scipy,
# toml, pyDRMetrics and yaml.
known_third_party = [
  "ipywidgets", "matplotlib", "numpy", "pandas", "plotly", "pyDRMetrics",
  "pylab", "rich", "sklearn", "scipy", "toml", "yaml",
]

[tool.black]
line-length = 90
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | _build
  | build
  | dist
  | site
  | graphify-out
  | pear_ebi/calculate_distances/linux_bin
  | pear_ebi/calculate_distances/mac_bin
)/
'''

[tool.coverage.run]
source = ["pear_ebi"]
# The CLI tests drive the real console script in a subprocess, which coverage cannot
# see without this. Without parallel mode __main__.py reads as 3% covered even though
# it is exercised end to end. pytest-cov installs the .pth hook that makes subprocesses
# start collecting.
parallel = true
omit = [
  "*/linux_bin/*",
  "*/mac_bin/*",
  "pear_ebi/test.py",       # a stray plotly demo; see the report
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

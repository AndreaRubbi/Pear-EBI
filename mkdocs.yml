site_name: PEAR-EBI
repo_name: "PEAR-EBI"
repo_url: "https://github.com/AndreaRubbi/Pear-EBI"
site_url: "https://andrearubbi.github.io/Pear-EBI/"
# Shown as the snippet under the title in search results, and in link previews. Without
# it, search engines invent one from whatever text happens to be near the top.
site_description: >-
  PEAR computes pairwise distances between phylogenetic trees and embeds them in two or
  three dimensions for visualisation, using Robinson-Foulds, quartet and triplet
  distances with PCoA, t-SNE, Isomap and locally linear embedding.
copyright: "Made by Andrea Rubbi"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AndreaRubbi/Pear-EBI
      name: PEAR on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pear-ebi/
      name: PEAR on PyPI
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/andrea-rubbi-9a06021a1/
      name: Andrea Rubbi on LinkedIn

# Navigation
# There is no 'nav' in this config because we use mkdocs-awesome-pages-plugin
# The ordering of pages in the docs folder are now in a `.pages` file instead

theme:
  name: material
  custom_dir: docs_assets/theme/
  palette:
    # "preference" was removed in mkdocs-material 5, so no scheme was applied at all.
    # A two-entry palette with a toggle is the modern equivalent.
    - scheme: default
      primary: green
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # The PEAR logo, not a generic code glyph. Both paths resolve under docs_dir.
  logo: "docs_assets/images/logo_pear.png"
  # This was pointing at a zero-byte favicon.ico, so the site had no icon at all --
  # including in Google's results, which is why none appeared there. A PNG that is
  # square and a multiple of 48px is what Google asks for; 192 is 48x4 and is also the
  # size browsers reach for on high-DPI tabs. docs_assets/images/ also carries a real
  # multi-size favicon.ico and an apple-touch-icon, both linked from the theme override
  # in docs_assets/theme/main.html.
  favicon: "docs_assets/images/favicon.png"
  language: "en"
  features:
    # Small quality-of-life additions, all inert if unsupported.
    - navigation.top          # back-to-top button on long pages (the tutorials)
    - navigation.tracking     # the URL follows the section being read
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy       # copy button on code blocks; the docs are full of commands
    - toc.follow

plugins:
  - search
  # mkdocstrings removed from the active plugin list. It was enabled but entirely
  # unused: there is not a single ::: directive anywhere in docs/ -- every API page
  # is mkgendocs output. Worse, its on_config hook inserts mkdocs-autorefs into the
  # plugin list, which happens before print-site's own hook runs and so made
  # print-site no longer last, emitting a warning that fails --strict builds.
  # The dependency is still declared in the docs group, so re-enabling it is a
  # one-line change if the API docs are ever moved onto it.
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: timeago
  - git-authors:
      show_contribution: True
  - table-reader
  - img2fig
  - mknotebooks:
      execute: false
      # mkdocs-material theme has nicer cell styling
      enable_default_jupyter_cell_styling: false
      enable_default_pandas_dataframe_styling: true
  - awesome-pages
  #    - enumerate-headings
  - print-site:
      exclude:
        - archive/*

markdown_extensions:
  - codehilite
  - markdown.extensions.admonition
  - markdown.extensions.attr_list
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Lots of other settings
edit_uri: edit/pear_ebi/docs/
use_directory_urls: false

# Better PDF styling for when you create PDFs using mkdocs-pdf-export-plugin
extra_css:
  - docs_assets/stylesheets/pdf-export.css  # under docs/, see note below

# Setup mathjax, see
# https://squidfunk.github.io/mkdocs-material/reference/mathjax/
extra_javascript:
  # Paths here resolve relative to docs_dir, not to this file. They used to point at
  # javascripts/config.js and docs_assets/... in the repo root, neither of which
  # exists under docs/, so the MathJax delimiter config never loaded and every $...$
  # in the tutorials rendered as literal LaTeX.
  - docs_assets/javascripts/config.js
  # polyfill.io REMOVED. That domain was sold in February 2024 and began serving
  # malware to visitors in June 2024; it must not be loaded. It only supplied ES6
  # polyfills for browsers that MathJax 3 no longer supports anyway, so nothing is
  # lost by dropping it. Do not reinstate it.
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

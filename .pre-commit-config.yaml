minimum_pre_commit_version: 3.2.0
# "commit"/"push" were renamed in pre-commit 3.2 and are rejected outright by
# pre-commit 4.x, which meant this config failed to load and none of the hooks
# below actually ran.
default_stages: [pre-commit, pre-push]

# tests/fixtures/ holds deliberately malformed inputs. Two of them have no trailing
# newline on purpose -- that is the exact condition the regression tests exercise --
# so end-of-file-fixer must not "repair" them, or the tests pass for the wrong
# reason. The vendored native build trees are third-party and not ours to reformat.
exclude: |
  (?x)^(
    tests/fixtures/.*
    |pear_ebi/calculate_distances/(linux_bin|mac_bin)/.*
    |site/.*
  )$
#default_language_version:
#  python: python3.10

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # double-quote-string-fixer removed: it converts " to ', which black then
      # converts straight back, so the two hooks fought on every commit.
      - id: name-tests-test
        # Defaults to demanding "*_test.py". pytest's own convention, and this
        # repository's, is "test_*.py" -- so without this argument the hook whose job
        # is catching misnamed test files failed on every correctly named one.
        args: ["--pytest-test-first"]
        # Everything under tests/ that is not itself a test: shared helpers have no
        # business being named test_*.py, and pytest would try to collect them.
        exclude: ^tests/(__init__|toml_compat)\.py$
      #- id: detect-aws-credentials
      - id: detect-private-key
      - id: check-added-large-files
        # Was types: ["python"], which is why 90 MB .trees files were committable.
        args: ["--maxkb=2048"]
  # Keep in step with black in [tool.poetry.group.dev.dependencies]: the lint job runs
  # pre-commit standalone, so this rev -- not the locked version -- decides the format.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        types: ["python"]
  - repo: https://github.com/asottile/blacken-docs
    rev: 1.13.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==26.5.1]
        types: ["python"]
  # mirrors-isort is frozen at isort 5.10.1; the real project is at 8.x, and the two
  # disagree about import grouping. Use isort's own repository so the rev can match.
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

name: Release

# One-click release. Actions -> Release -> Run workflow.
#
# Publishing is deliberately NOT tied to an ordinary push: PyPI refuses to overwrite an
# existing version, so "publish on every push" would either fail on the second push or
# require bumping the version for every README fix. This workflow does the whole
# sequence in one place, and refuses to publish anything that does not build and test
# cleanly first.

on:
  # A push releases only when the version in pyproject.toml is one that has not been
  # released yet: the gate job below checks for the tag and asks PyPI. So bumping the
  # version and pushing publishes, and every other push -- a README fix, a test, a
  # dependency bump -- skips the whole thing instead of failing against a version PyPI
  # already has.
  push:
    branches: [pear_ebi]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Bump level (patch, minor, major) or an explicit version such as 1.1.1.
          Passing the version already in pyproject.toml is allowed, and releases that
          version as it stands. Leave as-is for a plain re-run.
        required: false
        default: patch
      dry_run:
        description: "Build, test and verify only - do not commit, tag, publish or deploy"
        type: boolean
        default: false

permissions:
  contents: write   # commit the version bump, push the tag, deploy to gh-pages
  id-token: write   # PyPI Trusted Publishing (OIDC) - no API token needed

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap (a checkout and two lookups) so that an ordinary push costs almost nothing.
  gate:
    name: is this version unreleased?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, so an already-released version can be recognised

      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(grep -m1 -Po '(?<=^version = ")[^"]+' pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml declares $VERSION"

          if [ "$EVENT" != "push" ]; then
            # Dispatched by hand: the version input decides, so always go through.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "manual run: proceeding"; exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag v$VERSION already exists: nothing to release on this push"; exit 0
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/pear_ebi/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "PyPI already serves $VERSION: nothing to release on this push"; exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "$VERSION is unreleased (no tag, PyPI returned $CODE): releasing"

  release:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # See the same group in ci.yml: this job deploys the documentation too, and the two
      # must not force-push gh-pages simultaneously.
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: the git-revision-date-localized and git-authors mkdocs
          # plugins read it, and gh-deploy needs to push
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Refuse to release from a dirty tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The working tree is not clean:"; git status --porcelain; exit 1
          fi

      - name: Bump the version
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          OLD=$(poetry version --short)
          # No input on a push-triggered run: release what the tree already declares.
          if [ -n "$REQUESTED" ]; then
            poetry version "$REQUESTED"
          else
            echo "no version input (push-triggered): keeping $OLD"
          fi
          NEW=$(poetry version --short)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "pyproject.toml already declares $NEW; releasing it as it stands"
          else
            echo "Releasing $NEW (was $OLD)"
          fi

      - name: Refuse if that tag already exists
        run: |
          TAG='${{ steps.bump.outputs.tag }}'
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on the remote"; exit 1
          fi

      - name: Keep __version__ in step with pyproject
        # poetry version only edits pyproject.toml; pear_ebi/__init__.py carries the
        # version that `pear_ebi --version` reports.
        run: python tools/sync_version.py

      - name: Install the project
        run: poetry install --with dev,docs

      - name: Lockfile still consistent
        run: poetry check --lock

      - name: Version agrees everywhere
        # pyproject.toml, pear_ebi/__init__.py and CITATION.cff against each other, and
        # against what the interpreter imports and what the installed metadata says.
        #
        # A stale `pear_ebi.egg-info/` in the checkout would defeat the metadata half of
        # this: importlib.metadata searches sys.path, "" is on it when the working
        # directory is the repository, and a left-over egg-info there wins over the real
        # installed distribution. A runner starts from a clean clone so it cannot happen
        # here, but it does happen locally, which is why there is a test for it.
        env:
          DECLARED: ${{ steps.bump.outputs.version }}
        run: |
          poetry run python tools/sync_version.py --check
          poetry run python - <<'PY'
          import importlib.metadata as md, os, pear_ebi
          declared = os.environ["DECLARED"]
          assert pear_ebi.__version__ == declared, (pear_ebi.__version__, declared)
          assert md.version("pear_ebi") == declared, (md.version("pear_ebi"), declared)
          print("version consistent:", declared)
          PY

      - name: Run the full test suite
        env:
          MPLBACKEND: Agg
        run: poetry run pytest -q --timeout=1800

      - name: Build the distribution
        run: poetry build

      - name: Verify the artefacts
        # The same invariants the CI packaging job enforces. A release must not be able
        # to ship a wheel that shadows the stdlib `test` module, loses the executable
        # bit on the bundled binaries, drops the GPL licence texts, or balloons back to
        # the 118 MB it used to be.
        env:
          DECLARED: ${{ steps.bump.outputs.version }}
        run: |
          python - <<'PY'
          import glob, os, sys, zipfile
          declared = os.environ["DECLARED"]
          wheel = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(wheel)
          names = z.namelist()
          problems = []

          # The version PyPI will serve. Checked on the filenames and on the wheel's own
          # METADATA, because these are the copies that leave this machine.
          sdists = glob.glob("dist/*.tar.gz")
          if os.path.basename(wheel) != f"pear_ebi-{declared}-py3-none-any.whl":
              problems.append(f"unexpected wheel name: {os.path.basename(wheel)}")
          if [os.path.basename(s) for s in sdists] != [f"pear_ebi-{declared}.tar.gz"]:
              problems.append(f"unexpected sdist: {[os.path.basename(s) for s in sdists]}")
          try:
              metadata = z.read(f"pear_ebi-{declared}.dist-info/METADATA").decode()
          except KeyError:
              problems.append(f"wheel has no pear_ebi-{declared}.dist-info/METADATA")
          else:
              if f"Version: {declared}" not in metadata:
                  problems.append(f"wheel METADATA does not declare version {declared}")

          leaked = [n for n in names if n.split("/")[0] in {"test", "tests"}]
          if leaked:
              problems.append(f"top-level test package in the wheel: {leaked[:3]}")

          required_exec = [
              "pear_ebi/calculate_distances/linux_bin/HashRF/hashrf",
              "pear_ebi/calculate_distances/linux_bin/tqDist/bin/all_pairs_quartet_dist",
              "pear_ebi/calculate_distances/mac_bin/HashRF/hashrf",
          ]
          for name in required_exec:
              if name not in names:
                  problems.append(f"missing binary: {name}")
              elif not (z.getinfo(name).external_attr >> 16) & 0o111:
                  problems.append(f"not executable: {name}")

          for licence in [
              "pear_ebi/calculate_distances/linux_bin/HashRF/COPYING",
              "pear_ebi/calculate_distances/linux_bin/tqDist/COPYING",
              "pear_ebi/calculate_distances/linux_bin/tqDist/COPYING.LESSER",
              "pear_ebi/calculate_distances/mac_bin/HashRF/COPYING",
          ]:
              if licence not in names:
                  problems.append(f"missing licence text: {licence}")

          size_mb = sum(i.file_size for i in z.infolist()) / 1e6
          if size_mb > 20:
              problems.append(f"wheel is {size_mb:.1f} MB uncompressed")

          print(f"wheel: {size_mb:.1f} MB, {len(names)} files")
          if problems:
              print("\n".join(f"  - {p}" for p in problems)); sys.exit(1)
          print("artefact checks passed")
          PY

      - name: Install the wheel in a clean venv and run it
        # From /tmp, not the checkout: with the repository as the working directory ""
        # on sys.path makes ./pear_ebi shadow the installed package, and this would
        # silently exercise the source tree instead of the artefact being released.
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/relwork && cd /tmp/relwork
          PEAR_REPO="$GITHUB_WORKSPACE" DECLARED="${{ steps.bump.outputs.version }}" \
            /tmp/relcheck/bin/python - <<'PY'
          import importlib.metadata as md, os, pear_ebi
          loc = os.path.dirname(pear_ebi.__file__)
          assert "site-packages" in loc, loc
          assert os.environ["PEAR_REPO"] not in loc, loc
          declared = os.environ["DECLARED"]
          assert pear_ebi.__version__ == declared, (pear_ebi.__version__, declared)
          assert md.version("pear_ebi") == declared, (md.version("pear_ebi"), declared)
          print("installed cleanly:", pear_ebi.__version__)
          PY
          printf '(A:1,B:1,(C:1,D:1):1);\n(A:1,C:1,(B:1,D:1):1);\n(A:1,D:1,(B:1,C:1):1);\n' > t.nwk
          MPLBACKEND=Agg /tmp/relcheck/bin/pear_ebi t.nwk -m hashrf_RF -o d.csv
          test -s d.csv
          test "$(/tmp/relcheck/bin/pear_ebi --version)" = "pear_ebi ${{ steps.bump.outputs.version }}"

      - name: Build the documentation
        run: poetry run mkdocs build --strict

      - name: Reject a reintroduced polyfill.io reference
        # That domain was sold and served malware in June 2024.
        run: |
          if grep -rIl "polyfill\.io" site/ 2>/dev/null; then
            echo "polyfill.io reference found in the built site"; exit 1
          fi

      - name: Stop here if this is a dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: version ${{ steps.bump.outputs.version }} builds, tests and"
          echo "verifies cleanly. Nothing was committed, tagged, published or deployed."

      - name: Prepare the release commit, without pushing
        if: ${{ !inputs.dry_run }}
        id: prepare
        run: |
          git config user.name  "AndreaRubbi"
          git config user.email "andrea.rubbi.98@gmail.com"
          git add pyproject.toml pear_ebi/__init__.py CITATION.cff
          # Nothing to commit when the version being released is the one already in the
          # tree, which is the case for a push-triggered release: the human bumped it.
          if git diff --cached --quiet; then
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "already at ${{ steps.bump.outputs.version }}: nothing to commit"
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
            git commit -m "Release ${{ steps.bump.outputs.version }}"
          fi

      - name: Check git will accept the release before publishing it
        if: ${{ !inputs.dry_run && steps.prepare.outputs.commit == 'true' }}
        # Only reached when a bump has to be committed, which is the dispatch path.
        # pear_ebi is a protected branch, so that push can be rejected -- and it was,
        # after PyPI had already been published to, leaving a version on PyPI that
        # nothing in git recorded. --dry-run performs the real authentication and the
        # real server-side checks without transferring anything, so it fails here,
        # before the publish, and the same version can be retried.
        run: |
          if ! git push --dry-run origin HEAD:${{ github.ref_name }}; then
            echo "::error::Cannot push the release commit to ${{ github.ref_name }}."
            echo "Nothing has been published."
            echo ""
            echo "Release without a bump instead: change the version in pyproject.toml"
            echo "yourself, run tools/sync_version.py, push that commit, and the"
            echo "push-triggered release will publish and tag it -- no branch write"
            echo "from Actions needed."
            exit 1
          fi
          echo "git will accept the release commit"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        # After the checks above and before the pushes below, so that neither side can
        # get ahead of the other: nothing is published until git has agreed to record
        # it, and nothing is recorded until PyPI has accepted it.
        #
        # No API token is stored anywhere: the OIDC identity of this workflow is the
        # credential. See CONTRIBUTING.md for the fields to enter on PyPI.
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Push the release commit
        if: ${{ !inputs.dry_run && steps.prepare.outputs.commit == 'true' }}
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Tag the release and publish a GitHub release
        if: ${{ !inputs.dry_run }}
        # Through the API rather than `git push origin <tag>`, which cannot work here.
        # GITHUB_TOKEN is a GitHub App installation token, and GitHub refuses any push
        # from one that creates or updates a workflow file. Pushing a new tag counts:
        # the ref did not exist before, so .github/workflows/ci.yml at that ref is
        # "created" by the push, and it is rejected with
        #
        #   refusing to allow a GitHub App to create or update workflow
        #   `.github/workflows/ci.yml` without `workflows` permission
        #
        # That permission cannot be granted to GITHUB_TOKEN -- it is not one of the
        # keys the permissions block accepts -- so the push route is closed no matter
        # how the job is configured. Creating the ref through the API is not a push and
        # is not subject to the rule; `contents: write` is enough.
        #
        # It also gives the repository a Releases page, and attaches the very wheel and
        # sdist that went to PyPI, so the artefacts are downloadable from here too.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.bump.outputs.tag }}' \
            --target "$(git rev-parse HEAD)" \
            --title 'pear_ebi ${{ steps.bump.outputs.version }}' \
            --notes 'Published to PyPI: https://pypi.org/project/pear-ebi/${{ steps.bump.outputs.version }}/' \
            dist/*
          echo "tagged ${{ steps.bump.outputs.tag }} and created the release"

      - name: Deploy the documentation
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "AndreaRubbi"
          git config user.email "andrea.rubbi.98@gmail.com"
          poetry run mkdocs gh-deploy --force

      - name: Summary
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "### Released ${{ steps.bump.outputs.version }}"
            echo ""
            echo "- tag \`${{ steps.bump.outputs.tag }}\` pushed"
            echo "- published to https://pypi.org/project/pear-ebi/${{ steps.bump.outputs.version }}/"
            echo "- documentation deployed to gh-pages"
          } >> "$GITHUB_STEP_SUMMARY"
